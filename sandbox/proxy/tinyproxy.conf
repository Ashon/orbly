User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Connect
DisableViaHeader Yes

# 사설 대역(도커 네트워크)에서 오는 요청만 받는다.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# 허용 목록 방식: 목록에 없는 도메인은 모두 거부한다.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/tmp/allowed-domains.ere"

# HTTPS(CONNECT) 는 443 포트만 허용한다.
ConnectPort 443
