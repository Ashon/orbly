User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Connect
DisableViaHeader Yes

# Accepts requests only from private ranges (docker networks).
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Allowlist mode: every domain not on the list is denied.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/tmp/allowed-domains.ere"

# HTTPS (CONNECT) is allowed only on port 443.
ConnectPort 443
