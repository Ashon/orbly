# Example read-only account for Orbly. Apply it to each cluster to query. (kubectl apply -f)
#
# - Namespace-scoped resources are read with the built-in ClusterRole view. (Except secrets)
# - Cluster-scoped resources such as nodes, namespaces, storage, and metrics are read with orbly-ro-cluster.
# - A separate account keeps Orbly's queries distinct in audit logs and can be revoked on its own.
#
# If you change the name or namespace, also change OPS_K8S_SA and OPS_K8S_SA_NAMESPACE in .env.
# After applying, build the broker kubeconfig with pnpm k8s:kubeconfig.
apiVersion: v1
kind: Namespace
metadata:
  name: orbly
  labels:
    app: orbly
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbly-ro
  namespace: orbly
  labels:
    app: orbly
---
apiVersion: v1
kind: Secret
metadata:
  name: orbly-ro-token
  namespace: orbly
  annotations:
    kubernetes.io/service-account.name: orbly-ro
  labels:
    app: orbly
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbly-ro-view
  labels:
    app: orbly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: orbly-ro
    namespace: orbly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbly-ro-cluster
  labels:
    app: orbly
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbly-ro-cluster
  labels:
    app: orbly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orbly-ro-cluster
subjects:
  - kind: ServiceAccount
    name: orbly-ro
    namespace: orbly
