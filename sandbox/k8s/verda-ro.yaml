# Example read-only account for Verda. Apply it to each cluster to query. (kubectl apply -f)
#
# - Namespace-scoped resources are read with the built-in ClusterRole view. (Except secrets)
# - Cluster-scoped resources such as nodes, namespaces, storage, and metrics are read with verda-ro-cluster.
# - A separate account keeps Verda's queries distinct in audit logs and can be revoked on its own.
#
# If you change the name or namespace, also change OPS_K8S_SA and OPS_K8S_SA_NAMESPACE in .env.
# After applying, build the broker kubeconfig with pnpm k8s:kubeconfig.
apiVersion: v1
kind: Namespace
metadata:
  name: verda
  labels:
    app: verda
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verda-ro
  namespace: verda
  labels:
    app: verda
---
apiVersion: v1
kind: Secret
metadata:
  name: verda-ro-token
  namespace: verda
  annotations:
    kubernetes.io/service-account.name: verda-ro
  labels:
    app: verda
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: verda-ro-view
  labels:
    app: verda
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: verda-ro
    namespace: verda
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: verda-ro-cluster
  labels:
    app: verda
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: verda-ro-cluster
  labels:
    app: verda
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: verda-ro-cluster
subjects:
  - kind: ServiceAccount
    name: verda-ro
    namespace: verda
