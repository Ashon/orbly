# Example read-only account for Pacenote. Apply it to each cluster to query. (kubectl apply -f)
#
# - Namespace-scoped resources are read with the built-in ClusterRole view. (Except secrets)
# - Cluster-scoped resources such as nodes, namespaces, storage, and metrics are read with pacenote-ro-cluster.
# - A separate account keeps Pacenote's queries distinct in audit logs and can be revoked on its own.
#
# If you change the name or namespace, also change OPS_K8S_SA and OPS_K8S_SA_NAMESPACE in .env.
# After applying, build the broker kubeconfig with pnpm k8s:kubeconfig.
apiVersion: v1
kind: Namespace
metadata:
  name: pacenote
  labels:
    app: pacenote
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacenote-ro
  namespace: pacenote
  labels:
    app: pacenote
---
apiVersion: v1
kind: Secret
metadata:
  name: pacenote-ro-token
  namespace: pacenote
  annotations:
    kubernetes.io/service-account.name: pacenote-ro
  labels:
    app: pacenote
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pacenote-ro-view
  labels:
    app: pacenote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: pacenote-ro
    namespace: pacenote
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pacenote-ro-cluster
  labels:
    app: pacenote
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pacenote-ro-cluster
  labels:
    app: pacenote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pacenote-ro-cluster
subjects:
  - kind: ServiceAccount
    name: pacenote-ro
    namespace: pacenote
