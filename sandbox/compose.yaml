# 멘션 응답용 추론 샌드박스.
# - egress-proxy: 상시 실행. 내부 네트워크에서 허용 도메인으로만 나가는 출구
# - reasoner: 이미지 빌드 전용. 실행은 봇이 요청마다 docker run --rm 으로 띄운다.
# - renderer: 이미지 빌드 전용. 답변의 다이어그램/차트를 네트워크 없는 일회용 컨테이너에서 PNG 로 그린다.
# - ops-broker: (profile ops) 운영 점검 중계. SSH 키, kubeconfig, 작업 디렉터리를 가진 유일한
#   컨테이너이고, 추론 컨테이너에는 정해진 읽기 전용 조회만 MCP 도구로 제공한다.
#   값은 모두 설정 파일(VERDA_HOME/.env, 기본 ~/.verda/.env)의 OPS_* 에서 온다.
#   생성 파일과 비운 마운트의 빈 자리는 저장소 밖 VERDA_HOME/ops-broker 에 있고 (pnpm ops:prepare 가 만든다),
#   비운 기능은 broker 가 그 도구 없이 뜬다.
name: verda-sandbox

services:
  egress-proxy:
    build: ./proxy
    image: verda-egress-proxy:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - ./proxy/allowed-domains.txt:/etc/egress/allowed-domains.txt:ro
    networks:
      - sandbox
      - egress

  reasoner:
    build:
      context: ./reasoner
      args:
        CLAUDE_CODE_VERSION: "2.1.293"
        CODEX_VERSION: "0.161.0"
    image: verda-reasoner:latest
    profiles: ["build"]

  renderer:
    build:
      context: ./renderer
      args:
        MERMAID_CLI_VERSION: "12.0.0"
        VL_CONVERT_VERSION: "1.9.0.post1"
        PILLOW_VERSION: "12.3.0"
    image: verda-renderer:latest
    profiles: ["build"]

  ops-broker:
    build:
      context: ..
      dockerfile: sandbox/ops-broker/Dockerfile
      args:
        KUBECTL_VERSION: v1.37.0
    image: verda-ops-broker:latest
    profiles: ["ops"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 256
    mem_limit: 1g
    environment:
      SSH_USER: ${OPS_SSH_USER:-}
      ALLOWED_CIDR: ${OPS_SSH_ALLOWED_CIDR:-}
      # ws_* (코드 수정, draft PR). 비어 있으면 ws 도구 없이 뜬다.
      # 토큰은 pnpm sandbox:ops-up 이 gh auth token 으로 넘긴다. 커밋 작성자는 .env 의 OPS_GIT_AUTHOR_*,
      # 없으면 sandbox:ops-up 이 넘긴 전역 git 설정. (이 저장소의 git 설정은 쓰지 않는다)
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_AUTHOR_NAME: ${OPS_GIT_AUTHOR_NAME:-${GIT_AUTHOR_NAME:-}}
      GIT_AUTHOR_EMAIL: ${OPS_GIT_AUTHOR_EMAIL:-${GIT_AUTHOR_EMAIL:-}}
      # jira_* (조회, 이슈 생성, 댓글). 넷 중 하나라도 비면 jira 도구 없이 뜬다.
      JIRA_URL: ${OPS_JIRA_URL:-}
      JIRA_EMAIL: ${OPS_JIRA_EMAIL:-}
      JIRA_TOKEN: ${OPS_JIRA_TOKEN:-}
      JIRA_PROJECTS: ${OPS_JIRA_PROJECTS:-}
      GIT_ALLOWED_OWNERS: ${OPS_GIT_ALLOWED_OWNERS:-}
    volumes:
      # 호스트 SSH 점검 (host_*). 호스트 목록은 pnpm ops:prepare 가 인벤토리에서 만든다.
      - ${OPS_SSH_KEY:-${VERDA_HOME:-${HOME}/.verda}/ops-broker/unset/ssh-key}:/run/secrets/ssh-key:ro
      - ${OPS_SSH_KNOWN_HOSTS:-${VERDA_HOME:-${HOME}/.verda}/ops-broker/unset/known_hosts}:/run/secrets/known_hosts:ro
      - ${VERDA_HOME:-${HOME}/.verda}/ops-broker/hosts.json:/etc/ops/hosts.json:ro
      # k8s 조회 전용 kubeconfig (k8s_*). pnpm k8s:kubeconfig 로 생성
      - ${VERDA_HOME:-${HOME}/.verda}/ops-broker/kubeconfig:/run/secrets/kubeconfig:ro
      # 작업 디렉터리 (fs_*), 읽기 전용
      - ${OPS_FS_ROOT:-${VERDA_HOME:-${HOME}/.verda}/ops-broker/unset/workspace}:/workspace:ro
      # 에이전트 작업 공간 (ws_*): 원격 미러와 worktree. 로컬 저장소와 분리된다.
      - ops-work:/work
    networks:
      - sandbox
      - egress

volumes:
  ops-work:

networks:
  # 외부 라우팅이 없는 내부 전용 네트워크. 추론 컨테이너는 여기에만 붙는다.
  sandbox:
    name: verda-sandbox
    internal: true
  egress:
    name: verda-egress
