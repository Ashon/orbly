# Reasoner sandbox for mention replies. Shared by the repository (pnpm sandbox:*) and the desktop app (sandbox inside the bundle).
# Jobs are run by src/tools/sandbox-job.ts. All files that change live under VERDA_HOME (default ~/.verda).
# - egress-proxy: always running. The exit from the internal network to allowed domains only
# - reasoner: image build only. The bot starts it per request with docker run --rm.
# - renderer: image build only. Renders diagrams/charts in answers to PNG in a disposable container without network.
# - ops-broker: (profile ops) ops check relay. The only container that holds the SSH key, kubeconfig,
#   and work directory. It offers the reasoner container only fixed read-only queries as MCP tools.
#   All values come from OPS_* in the config file (VERDA_HOME/.env, default ~/.verda/.env).
#   Generated files and empty placeholders for unset mounts are in VERDA_HOME/ops-broker outside the repository (created by the broker job),
#   and for unset features the broker starts without those tools.
name: verda-sandbox

services:
  egress-proxy:
    build: ./proxy
    image: verda-egress-proxy:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      # Allowed domains list. If missing, the job creates it from proxy/allowed-domains.txt. (Edited in the settings screen)
      - ${VERDA_HOME:-${HOME}/.verda}/sandbox/allowed-domains.txt:/etc/egress/allowed-domains.txt:ro
    networks:
      - sandbox
      - egress

  reasoner:
    build:
      context: ./reasoner
      args:
        CLAUDE_CODE_VERSION: "2.1.293"
        CODEX_VERSION: "0.161.0"
    image: verda-reasoner:latest
    profiles: ["build"]

  renderer:
    build:
      context: ./renderer
      args:
        MERMAID_CLI_VERSION: "12.0.0"
        VL_CONVERT_VERSION: "1.9.0.post1"
        PILLOW_VERSION: "12.3.0"
    image: verda-renderer:latest
    profiles: ["build"]

  ops-broker:
    build:
      # The broker image contains only the prebuilt bundle (ops-broker/dist/server.mjs, pnpm bundle).
      context: ./ops-broker
      args:
        KUBECTL_VERSION: v1.37.0
    image: verda-ops-broker:latest
    profiles: ["ops"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 256
    mem_limit: 1g
    environment:
      SSH_USER: ${OPS_SSH_USER:-}
      ALLOWED_CIDR: ${OPS_SSH_ALLOWED_CIDR:-}
      # ws_* (code changes, draft PRs). If empty, the broker starts without the ws tools.
      # pnpm sandbox:ops-up passes the token from gh auth token. The commit author is OPS_GIT_AUTHOR_* in .env,
      # otherwise the global git config passed by sandbox:ops-up. (This repository's git config is not used)
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_AUTHOR_NAME: ${OPS_GIT_AUTHOR_NAME:-${GIT_AUTHOR_NAME:-}}
      GIT_AUTHOR_EMAIL: ${OPS_GIT_AUTHOR_EMAIL:-${GIT_AUTHOR_EMAIL:-}}
      # jira_* (queries, issue creation, comments). If any of the four is empty, the broker starts without the jira tools.
      JIRA_URL: ${OPS_JIRA_URL:-}
      JIRA_EMAIL: ${OPS_JIRA_EMAIL:-}
      JIRA_TOKEN: ${OPS_JIRA_TOKEN:-}
      JIRA_PROJECTS: ${OPS_JIRA_PROJECTS:-}
      GIT_ALLOWED_OWNERS: ${OPS_GIT_ALLOWED_OWNERS:-}
    volumes:
      # Host SSH checks (host_*). The broker job builds the host list from the inventory.
      - ${OPS_SSH_KEY:-${VERDA_HOME:-${HOME}/.verda}/ops-broker/unset/ssh-key}:/run/secrets/ssh-key:ro
      - ${OPS_SSH_KNOWN_HOSTS:-${VERDA_HOME:-${HOME}/.verda}/ops-broker/unset/known_hosts}:/run/secrets/known_hosts:ro
      - ${VERDA_HOME:-${HOME}/.verda}/ops-broker/hosts.json:/etc/ops/hosts.json:ro
      # Read-only k8s kubeconfig (k8s_*). Built with pnpm k8s:kubeconfig
      - ${VERDA_HOME:-${HOME}/.verda}/ops-broker/kubeconfig:/run/secrets/kubeconfig:ro
      # Work directory (fs_*), read-only
      - ${OPS_FS_ROOT:-${VERDA_HOME:-${HOME}/.verda}/ops-broker/unset/workspace}:/workspace:ro
      # Agent workspace (ws_*): remote mirrors and worktrees. Kept separate from local repositories.
      - ops-work:/work
    networks:
      - sandbox
      - egress

volumes:
  ops-work:

networks:
  # Internal-only network with no external routing. Reasoner containers attach only to this one.
  sandbox:
    name: verda-sandbox
    internal: true
  egress:
    name: verda-egress
