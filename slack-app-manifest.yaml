# Paste into "From an app manifest" when creating the Slack app.
# The bot answers in the thread when it is mentioned in a public channel. It uses no user token and no DM scopes.
display_information:
  name: Pacenote
  description: "You drive. Pacey reads the notes. Answers public channel mentions with local claude/codex CLIs."
  long_description: When mentioned in a public channel, Pacey collects the thread context and attachments, hands the reasoning to a local claude or codex CLI, and answers in the same thread. From a sandbox it can query servers, k8s and a work directory, or draw diagrams. Code changes are posted as draft PRs.
  background_color: "#0b6e5b"
features:
  bot_user:
    display_name: Pacey
    always_online: true
oauth_config:
  scopes:
    bot:
      # Receive mention events
      - app_mentions:read
      # Read thread context (conversations.replies, conversations.history)
      - channels:history
      # Check whether a channel is public (conversations.info)
      - channels:read
      # Post replies
      - chat:write
      # Download files attached to mentions and threads (url_private_download)
      - files:read
      # Upload diagrams and generated images (files.uploadV2)
      - files:write
      # Show user names in the context
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
