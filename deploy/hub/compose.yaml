# Orbly team hub on a server of its own (README "Team hub").
#   cp hub.env.example hub.env   # the Slack app's tokens live only here
#   docker compose up -d --build # after pnpm bundle (the image copies dist/hub.mjs)
# The hub listens on 127.0.0.1:8790; put HTTPS in front of it (Caddy, nginx, or a tunnel) and give members that URL.
name: orbly-hub
services:
  hub:
    build: .
    image: orbly-hub:latest
    restart: unless-stopped
    env_file: hub.env
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - hub-data:/data
volumes:
  hub-data:
